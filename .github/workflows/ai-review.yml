# AI Code Review (день 32): ассистент анализирует новый PR.
# Diff + RAG по документации и коду -> ревью (баги / архитектура / рекомендации)
# -> комментарий в PR (обновляется при новых пушах).
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # GPUStack — внутренний сервис (приватный IP): GitHub-hosted runner его не видит.
    # Для доступа из корп. сети заведи self-hosted runner и поставь runs-on: self-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run AI review
        env:
          # GPUStack (OpenAI-совместимый API)
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # LLM_MODEL / EMBED_MODEL имеют дефолты в review.js — секреты не обязательны
          # GitHub PR-контекст
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node ai-review/review.js
