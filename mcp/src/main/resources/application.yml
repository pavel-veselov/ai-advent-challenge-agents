spring:
  application:
    name: papkin-helper
  # SQLite-хранилище планировщика (Day-18): файл scheduler.db в рабочем каталоге,
  # таблицы создаются идемпотентно в SchedulerStore (CREATE TABLE IF NOT EXISTS).
  datasource:
    url: jdbc:sqlite:scheduler.db
    driver-class-name: org.sqlite.JDBC
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: papkin-helper
        version: 0.1.0
        # ASYNC -> @McpTool методы могут возвращать Mono/Flux (реактивно, без блокировки event loop).
        type: ASYNC
        streamable-http:
          # Путь Streamable HTTP endpoint, по которому подключается MCP-клиент.
          mcp-endpoint: /mcp
