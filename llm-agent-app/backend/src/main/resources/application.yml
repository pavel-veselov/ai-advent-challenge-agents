spring:
  application:
    name: llm-agent
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:./data/llm-agent.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always          # выполняем schema.sql при каждом старте (CREATE TABLE IF NOT EXISTS)
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # Причины 400/404 кладём в JSON-поле message (ResponseStatusException / LlmSettingsValidationException):
    # фронтенд показывает их пользователю (например «Модель отключена в каталоге», «Неизвестная модель»).
    # По умолчанию в WebFlux сообщения скрыты (never).
    include-message: always

llm:
  provider: ${LLM_PROVIDER:gpustack}        # только gpustack (mock удалён)
  base-url: ${LLM_BASE_URL:}                # например https://<GPUStack-URL> (без /v1)
  api-key: ${LLM_API_KEY:}                  # Bearer-ключ GPUStack (из настроек opencode)
  model: ${LLM_MODEL:default-coding}
  temperature: ${LLM_TEMPERATURE:0.7}
  top-p: ${LLM_TOP_P:1.0}                   # nucleus sampling
  top-k: ${LLM_TOP_K:}                      # пусто = не задано (параметр не уходит в API)
  max-tokens: ${LLM_MAX_TOKENS:10000}       # дефолтный лимит выходных токенов (10000)
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:7200}
  context-limit: ${LLM_CONTEXT_LIMIT:126608}          # лимит контекста модели в токенах
  price-input-per-1m: ${LLM_PRICE_INPUT_PER_1M:0.1}   # условная цена в USD за 1M входных токенов
  price-output-per-1m: ${LLM_PRICE_OUTPUT_PER_1M:0.1} # условная цена в USD за 1M выходных токенов

agent:
  max-tool-call-iterations: ${AGENT_MAX_ITERATIONS:8}
  scheduler:
    tick-ms: ${AGENT_SCHEDULER_TICK_MS:15000}

logging:
  level:
    root: INFO
