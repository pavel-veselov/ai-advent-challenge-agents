<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AI-ассистент поддержки</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    #profile {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-dim);
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      max-width: 240px;
    }

    #profile:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <h1>AI-ассистент поддержки</h1>
    </div>
    <div class="topbar-meta">
      <select id="profile" title="Профиль пользователя" aria-label="Профиль пользователя"></select>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div id="empty-state" class="empty-state">
      <div class="empty-glyph" aria-hidden="true">?</div>
      <h2>Чем можем помочь?</h2>
      <p class="hint">Опишите проблему — поможем или создадим тикет в поддержку</p>
      <div class="chips">
        <button type="button" class="chip-btn" data-prompt="Почему не работает авторизация?">Почему не работает авторизация?</button>
        <button type="button" class="chip-btn" data-prompt="Как сбросить пароль?">Как сбросить пароль?</button>
        <button type="button" class="chip-btn" data-prompt="Я оплатил подписку, но статус не обновился">Оплата прошла, статус подписки не обновился</button>
        <button type="button" class="chip-btn" data-prompt="Как изменить тарифный план?">Как изменить тарифный план?</button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" maxlength="4000"
        placeholder="Опишите вашу проблему… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button type="button" id="stop-btn" class="btn stop hidden" title="Остановить генерацию">■</button>
      <button type="button" id="send-btn" class="btn send" title="Отправить">➤</button>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
