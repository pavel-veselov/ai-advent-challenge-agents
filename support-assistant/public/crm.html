<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CRM — пользователи и тикеты</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    a.chip { text-decoration: none; }
    a.chip:hover { color: var(--text); border-color: var(--accent); }

    .crm {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 40px;
    }

    .crm-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .crm h2 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 600;
    }

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }

    th, td {
      text-align: left;
      vertical-align: top;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: var(--surface-2);
      font-weight: 600;
      color: var(--text-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    tbody tr:last-child td { border-bottom: 0; }

    tbody tr:nth-child(2n) { background: rgba(255, 255, 255, 0.02); }

    td.wrap { white-space: normal; min-width: 220px; }

    .st {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .st.open { color: var(--accent); background: var(--accent-tint); }

    .st.resolved { color: var(--text-dim); }

    .st.blocked {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(248, 81, 73, 0.08);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    select, input[type="text"] {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 7px 10px;
    }

    select:focus, input:focus { outline: none; border-color: var(--accent); }

    .filter-row input { flex: 1; min-width: 220px; }

    .ticket-form {
      display: grid;
      grid-template-columns: 260px 1fr 140px auto;
      gap: 8px;
      align-items: center;
    }

    @media (max-width: 760px) {
      .ticket-form { grid-template-columns: 1fr 1fr; }
    }

    .btn-primary {
      background: var(--accent);
      color: #06281f;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      cursor: pointer;
    }

    .btn-primary:hover { filter: brightness(1.1); }

    .btn-primary:disabled { opacity: 0.5; cursor: default; }

    #crm-error {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--danger);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 0 0 4px;
    }

    .error-text { color: var(--danger); font-size: 13px; margin: 8px 0 0; }

    .ok-text { color: var(--accent); font-size: 13px; margin: 8px 0 0; }

    .muted { color: var(--text-dim); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <h1>CRM — пользователи и тикеты</h1>
    </div>
    <div class="topbar-meta">
      <a class="chip" href="/" title="Вернуться к ассистенту" style="text-decoration:none;">← к ассистенту</a>
    </div>
  </header>

  <main class="crm">
    <div class="crm-inner">
      <p id="crm-error" class="error-text hidden"></p>

      <section aria-labelledby="users-h">
        <h2 id="users-h">Пользователи</h2>
        <div class="table-wrap">
          <table id="users-table">
            <thead>
              <tr>
                <th>ID</th><th>Имя</th><th>Email</th><th>Тариф</th><th>Статус</th><th>Причина блокировки</th>
              </tr>
            </thead>
            <tbody id="users-body"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="tickets-h">
        <h2 id="tickets-h">Тикеты</h2>
        <div class="filter-row">
          <select id="ticket-status" title="Фильтр по статусу">
            <option value="all">все статусы</option>
            <option value="open">открыт</option>
            <option value="resolved">решён</option>
          </select>
          <input type="text" id="ticket-user" placeholder="Фильтр: email или ID пользователя" spellcheck="false" autocomplete="off">
        </div>
        <div class="table-wrap">
          <table id="tickets-table">
            <thead>
              <tr>
                <th>ID</th><th>Пользователь</th><th>Тема</th><th>Статус</th><th>Приоритет</th><th>Создан</th><th>Обновлён</th>
              </tr>
            </thead>
            <tbody id="tickets-body"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="create-h">
        <h2 id="create-h">Создать тикет</h2>
        <form id="ticket-form" class="ticket-form">
          <select id="ticket-user-id" required aria-label="Пользователь"></select>
          <input type="text" id="ticket-subject" placeholder="Тема тикета" required maxlength="200" aria-label="Тема">
          <select id="ticket-priority" aria-label="Приоритет">
            <option value="low">low</option>
            <option value="normal" selected>normal</option>
            <option value="high">high</option>
          </select>
          <button type="submit" id="ticket-submit" class="btn-primary">Создать</button>
        </form>
        <p id="form-msg" class="hidden"></p>
      </section>
    </div>
  </main>

  <script src="/crm.js"></script>
</body>
</html>
